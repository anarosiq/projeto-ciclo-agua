<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Paisagem ilustrativa do ciclo da água">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf3fb"/>
      <stop offset="60%" stop-color="#d7e9f7"/>
      <stop offset="100%" stop-color="#c3ddef"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bcdcef"/>
      <stop offset="100%" stop-color="#5b9bd5"/>
    </linearGradient>
    <linearGradient id="mountain1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef4f9"/>
      <stop offset="100%" stop-color="#c7d7e3"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8e4ee"/>
      <stop offset="100%" stop-color="#a9bfcf"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="60%" stop-color="#f5c36b"/>
      <stop offset="100%" stop-color="#f5c36b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#sky)"/>

  <!-- sol -->
  <circle cx="620" cy="180" r="110" fill="url(#sun)"/>
  <circle cx="620" cy="180" r="42" fill="#f9d78a"/>

  <!-- nuvens -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="230" cy="150" rx="70" ry="26"/>
    <ellipse cx="280" cy="140" rx="50" ry="22"/>
    <ellipse cx="190" cy="140" rx="45" ry="20"/>
  </g>
  <g fill="#ffffff" opacity="0.6">
    <ellipse cx="470" cy="110" rx="55" ry="18"/>
    <ellipse cx="510" cy="120" rx="35" ry="14"/>
  </g>

  <!-- montanhas ao fundo -->
  <polygon points="120,520 260,300 340,460 420,260 560,520" fill="url(#mountain2)"/>
  <polygon points="200,520 330,340 400,460 470,300 640,520" fill="url(#mountain1)"/>
  <!-- neve nos picos -->
  <polygon points="330,340 350,380 310,378" fill="#ffffff"/>
  <polygon points="470,300 492,344 448,342" fill="#ffffff"/>

  <!-- floresta -->
  <g fill="#6fa080">
    <polygon points="140,520 165,455 190,520"/>
    <polygon points="170,520 198,440 226,520"/>
    <polygon points="205,520 230,460 255,520"/>
    <polygon points="110,520 132,468 154,520"/>
  </g>
  <g fill="#8fbfa0">
    <polygon points="150,520 172,470 194,520"/>
    <polygon points="185,520 210,450 235,520"/>
    <polygon points="90,520 112,478 134,520"/>
  </g>

  <!-- solo / margem -->
  <path d="M0,540 C150,510 250,560 400,530 C550,505 650,545 800,520 L800,600 L0,600 Z" fill="#d9c9a8" opacity="0.55"/>

  <!-- água -->
  <path d="M0,560 C180,600 300,540 460,585 C600,620 700,570 800,600 L800,800 L0,800 Z" fill="url(#water)"/>
  <g stroke="#eaf3fb" stroke-width="3" opacity="0.5" fill="none">
    <path d="M60,650 C140,635 200,665 280,650"/>
    <path d="M400,690 C480,675 540,705 620,690"/>
    <path d="M100,740 C200,725 280,755 380,740"/>
  </g>
</svg>
